<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17463c">
  <meta name="description" content="कुत्तों की रोज़ की देखभाल, टीकाकरण, डीवॉर्मिंग और गर्भावस्था की हिंदी गाइड।">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="paw.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="paw.svg">
  <title>PawCare — डॉग केयर गाइड</title>
  <style>
    :root{--green:#17463c;--green2:#246a55;--mint:#e5f2e9;--cream:#faf9f4;--ink:#20352f;--muted:#64756e;--line:#e1e9e2;--coral:#c65c46;--shadow:0 12px 34px #173d3011}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"Nirmala UI","Kohinoor Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.65}
    button,a{font:inherit} .shell{max-width:1080px;margin:auto;min-height:100dvh;padding-bottom:90px}
    header{background:var(--green);color:white;padding:calc(18px + env(safe-area-inset-top)) 22px 26px;border-radius:0 0 28px 28px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.04em}.brand img{width:34px;height:34px}.lang{border:1px solid #ffffff48;color:white;background:#ffffff16;border-radius:20px;padding:5px 12px;font-size:13px}
    .welcome{margin-top:24px}.eyebrow{font-size:12px;color:#c4e5d4;letter-spacing:.08em}.welcome h1{font-size:clamp(25px,6vw,38px);line-height:1.25;margin:5px 0 8px}.welcome p{margin:0;color:#dcebe1;max-width:520px;font-size:15px}
    main{padding:22px 18px;max-width:760px;margin:auto}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:8px 0 14px}.section-head h2{font-size:21px;margin:0;color:var(--green)}.section-head small{color:var(--muted)}
    .quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{border:1px solid var(--line);background:white;border-radius:18px;padding:17px;text-align:left;box-shadow:var(--shadow);color:var(--ink);cursor:pointer;min-height:115px;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.98)}.tile .icon{font-size:24px;display:block;margin-bottom:5px}.tile b{font-size:15px}.tile small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .notice{margin-top:19px;border-radius:18px;padding:16px;background:#fff2e9;border:1px solid #f4d6c7;display:flex;gap:12px}.notice .icon{font-size:22px}.notice strong{color:#80402d}.notice p{font-size:13px;color:#704b3c;margin:3px 0 0}
    .page-title{font-size:25px;line-height:1.3;color:var(--green);margin:5px 0 17px}.content-card{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:18px 18px 8px}.content-card h3{font-size:17px;color:var(--green2);margin:8px 0}.content-card p{margin:0 0 15px}.content-card ul{padding-left:21px;margin:7px 0 18px}.content-card li{padding-left:3px;margin:0 0 12px}.content-card li::marker{color:var(--green2)}.callout{padding:13px 15px;border-radius:14px;background:var(--mint);margin:12px 0 18px}.callout.red{background:#fff0eb;color:#743b2e}.callout strong{display:block}.sources a{color:var(--green2);overflow-wrap:anywhere}.back{border:0;background:transparent;color:var(--green2);font-weight:700;padding:10px 0;cursor:pointer}
    nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-inner{width:min(100%,760px);display:flex;justify-content:space-around}.navbtn{border:0;background:none;color:var(--muted);font-size:11px;display:grid;justify-items:center;gap:1px;padding:4px 7px;cursor:pointer}.navbtn span{font-size:20px;line-height:1.2}.navbtn.active{color:var(--green2);font-weight:700}.navbtn.active span{transform:translateY(-1px)}
    .install{display:none;position:fixed;z-index:9;inset:0;background:#10231dcc;align-items:end;justify-content:center;padding:15px}.install.show{display:flex}.install-box{background:white;border-radius:24px;padding:22px;max-width:430px;width:100%;box-shadow:var(--shadow)}.install-box h3{color:var(--green);margin:0 0 8px}.install-box p{margin:5px 0;color:var(--muted);font-size:14px}.install-box button{border:0;border-radius:13px;padding:12px 18px;background:var(--green2);color:white;font-weight:700;margin-top:14px;width:100%}
    .site-footer{text-align:center;padding:12px 18px 16px;color:var(--muted);font-size:13px}.site-footer a{color:var(--green2)}
    @media(min-width:720px){header{padding-left:max(28px,calc((100vw - 980px)/2));padding-right:max(28px,calc((100vw - 980px)/2));border-radius:0 0 34px 34px}.quick{grid-template-columns:repeat(3,1fr)}main{padding-top:30px}.content-card{padding:25px 30px 12px}.tile{min-height:130px;padding:20px}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="top"><div class="brand"><img src="paw.svg" alt=""> PAWCARE</div><button class="lang" id="installOpen">ऐप इंस्टॉल करें</button></div><div class="welcome"><div class="eyebrow">प्यार • समझदारी • देखभाल</div><h1>आपके प्यारे साथी के लिए<br>सेहतमंद ज़िंदगी 🐾</h1><p>डॉग की देखभाल के लिए आसान हिंदी गाइड। कोई विषय चुनकर शुरू करें।</p></div></header>
  <main id="app"></main>
  <footer class="site-footer"><a href="privacy.html">गोपनीयता नीति</a></footer>
</div>
<nav><div class="nav-inner" id="nav"></div></nav>
<div class="install" id="install"><div class="install-box"><h3>📲 PawCare को होम स्क्रीन पर जोड़ें</h3><p id="installHelp">ऐप की तरह इस्तेमाल करने के लिए अपने ब्राउज़र के Share या मेन्यू से “Add to Home Screen” चुनें।</p><button id="installClose">समझ गया</button></div></div>
<script src="app.js"></script>
</body>
</html>
